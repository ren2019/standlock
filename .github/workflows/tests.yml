name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Marketing version
        required: true
        default: "0.18.0"
        type: string
      build_number:
        description: Build number
        required: true
        default: "35"
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run StandLockKit tests
        run: swift test --package-path StandLockKit

  # swift test never compiles the app target.
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the app
        run: |
          xcodebuild build \
            -project StandLock.xcodeproj \
            -scheme StandLock \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            OTHER_SWIFT_FLAGS='-Xfrontend -disable-default-cmo' \
            CODE_SIGNING_ALLOWED=NO

      - name: Package the Release app
        run: ditto -c -k --keepParent "$RUNNER_TEMP/DerivedData/Build/Products/Release/StandLock.app" "$RUNNER_TEMP/StandLock.zip"

      - name: Upload the Release app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StandLock-${{ github.sha }}
          path: ${{ runner.temp }}/StandLock.zip
          retention-days: 7

  install:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, build]
    runs-on: macos-26
    env:
      SCHEME: StandLock
      TEAM_ID: F475N5N7V6
      VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run StandLockKit tests
        run: swift test --package-path StandLockKit

      - name: Setup keychain and import certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: scripts/setup-keychain.sh

      - name: Setup notarization credentials
        env:
          P8_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          P8_PATH="$RUNNER_TEMP/api-key.p8"
          echo "$P8_KEY" > "$P8_PATH"
          xcrun notarytool store-credentials "ci-notary" \
            --key "$P8_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
          rm -f "$P8_PATH"

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project StandLock.xcodeproj -scheme "$SCHEME" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Archive
        run: |
          xcodebuild archive \
            -project StandLock.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/StandLock.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ARCHS=arm64 \
            OTHER_SWIFT_FLAGS='-Xfrontend -disable-default-cmo' \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export archive
        run: |
          cat > "$RUNNER_TEMP/export-options.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>F475N5N7V6</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StandLock.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist"

      - name: Verify exported app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/StandLock.app"
          PLIST="$APP/Contents/Info.plist"
          BUILT_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$PLIST")
          BUILT_NAME=$(/usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "$PLIST")
          BUILT_SHORT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          BUILT_BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          BUILT_TEAM=$(codesign -dvv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          echo "built ${BUILT_NAME} ${BUILT_SHORT} (${BUILT_BUILD})"
          if [ "$BUILT_ID" != "com.yagizdokumaci.standlock" ]; then
            echo "::error::unexpected bundle identifier ${BUILT_ID}"
            exit 1
          fi
          if [ "$BUILT_NAME" != "StandLock" ]; then
            echo "::error::unexpected display name ${BUILT_NAME}"
            exit 1
          fi
          if [ "$BUILT_SHORT" != "$VERSION" ]; then
            echo "::error::app reports ${BUILT_SHORT} but the workflow supplied ${VERSION}"
            exit 1
          fi
          if [ "$BUILT_BUILD" != "$BUILD_NUMBER" ]; then
            echo "::error::app reports build ${BUILT_BUILD} but the workflow supplied ${BUILD_NUMBER}"
            exit 1
          fi
          if [ "$BUILT_TEAM" != "$TEAM_ID" ]; then
            echo "::error::unexpected TeamIdentifier ${BUILT_TEAM}"
            exit 1
          fi

      - name: Fix Sparkle framework symlinks
        run: scripts/fix-sparkle-symlinks.sh

      - name: Re-sign app and frameworks
        run: scripts/resign-app.sh

      - name: Verify entitlements survived the re-sign
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/StandLock.app"
          if ! codesign -d --entitlements - "$APP" | grep -q personal-information.calendars; then
            echo "::error::calendars entitlement missing after re-sign"
            exit 1
          fi

      - name: Notarize and staple app
        run: |
          ditto -c -k --keepParent --rsrc --sequesterRsrc \
            "$RUNNER_TEMP/export/StandLock.app" "$RUNNER_TEMP/StandLock-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/StandLock-notarize.zip" \
            --keychain-profile "ci-notary" --wait
          xcrun stapler staple "$RUNNER_TEMP/export/StandLock.app"

      - name: Package stapled app
        run: |
          ditto -c -k --keepParent --rsrc --sequesterRsrc \
            "$RUNNER_TEMP/export/StandLock.app" "$RUNNER_TEMP/StandLock.zip"

      - name: Upload signed app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StandLock-signed-${{ github.sha }}
          path: ${{ runner.temp }}/StandLock.zip
          retention-days: 7

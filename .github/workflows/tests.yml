name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run StandLockKit tests
        run: swift test --package-path StandLockKit

  # swift test never compiles the app target.
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the app
        run: |
          xcodebuild build \
            -project StandLock.xcodeproj \
            -scheme StandLock \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package the Debug app
        run: ditto -c -k --keepParent "$RUNNER_TEMP/DerivedData/Build/Products/Debug/StandLock.app" "$RUNNER_TEMP/StandLock.zip"

      - name: Upload the Debug app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StandLock-${{ github.sha }}
          path: ${{ runner.temp }}/StandLock.zip
          retention-days: 7
